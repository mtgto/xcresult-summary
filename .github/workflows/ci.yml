name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check dist is up to date
        run: git diff --exit-code dist

  e2e:
    name: e2e (Xcode ${{ matrix.xcode }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported: the version this action is developed and tested with.
          - runner: xcode-27
            xcode: "27.2"
            supported: true
          # Not supported, only checked: older Xcode versions, and Intel (no Intel runner has Xcode 27).
          - runner: macos-26
            xcode: "26.6"
            supported: false
          - runner: macos-15-intel
            xcode: "16.0"
            supported: false
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.supported }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun xcresulttool version
      - name: Run sample tests (some tests fail on purpose)
        id: test
        continue-on-error: true
        working-directory: fixtures/SampleApp
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SampleApp \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -parallel-testing-enabled YES \
            -resultBundlePath build/parallel.xcresult | xcbeautify
      - uses: ./
        id: report
        with:
          path: fixtures/SampleApp/build/parallel.xcresult
          title: Sample (Xcode ${{ matrix.xcode }}, ${{ matrix.runner }})
      - name: Check outputs
        env:
          TOTAL: ${{ steps.report.outputs.total-tests }}
          FAILED: ${{ steps.report.outputs.failed-tests }}
          COVERAGE: ${{ steps.report.outputs.line-coverage }}
        run: |
          echo "total=$TOTAL failed=$FAILED coverage=$COVERAGE"
          test "$TOTAL" = 6
          test "$FAILED" = 2
          test -n "$COVERAGE"
