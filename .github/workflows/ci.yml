name: CI

# Skip changes that can't affect the build or the action (documentation and saved schemas).
on:
  push:
    branches: [main]
    paths-ignore: &paths-ignore
      - "**.md"
      - LICENSE
      - schemas/**
  pull_request:
    paths-ignore: *paths-ignore

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check dist is up to date
        run: git diff --exit-code dist

  e2e:
    # Xcode 27 is required (xcresulttool schema 0.4.0), and only the xcode-27 runner (arm64) has it.
    runs-on: xcode-27
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        xcode: ["27.0", "27.1", "27.2"]
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun xcresulttool version
      - name: Run sample tests (some tests fail on purpose)
        id: test
        continue-on-error: true
        working-directory: fixtures/SampleApp
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SampleApp \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -parallel-testing-enabled YES \
            -resultBundlePath build/parallel.xcresult | xcbeautify
      - uses: $/
        id: report
        with:
          path: fixtures/SampleApp/build/parallel.xcresult
          title: Sample
      - name: Check outputs
        env:
          TOTAL: ${{ steps.report.outputs.total-tests }}
          FAILED: ${{ steps.report.outputs.failed-tests }}
          COVERAGE: ${{ steps.report.outputs.line-coverage }}
        run: |
          echo "total=$TOTAL failed=$FAILED coverage=$COVERAGE"
          test "$TOTAL" = 6
          test "$FAILED" = 2
          test -n "$COVERAGE"
      # Result bundles of two schemes (test plans): `get test-results tests` of the merged bundle
      # has only the first test plan, so the action has to read the tests of each bundle.
      - name: Run tests of another package
        working-directory: fixtures/Greeter
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Greeter \
            -destination 'platform=macOS' \
            -resultBundlePath build/Greeter.xcresult | xcbeautify
      # Every step has its own GITHUB_STEP_SUMMARY, so run the action directly to check its summary.
      - name: Report result bundles of two schemes
        env:
          OUT: ${{ runner.temp }}/merged
        run: |
          mkdir -p "$OUT"
          : > "$OUT/summary.md"
          : > "$OUT/output.txt"
          env \
            "INPUT_PATH=$(printf '%s\n' fixtures/SampleApp/build/parallel.xcresult fixtures/Greeter/build/Greeter.xcresult)" \
            "INPUT_TITLE=Sample and Greeter" \
            "INPUT_SHOW-PASSED-TESTS=true" \
            "INPUT_SHOW-CODE-COVERAGE=true" \
            "INPUT_FAIL-ON-ERROR=false" \
            "GITHUB_STEP_SUMMARY=$OUT/summary.md" \
            "GITHUB_OUTPUT=$OUT/output.txt" \
            node dist/index.mjs
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          output() { grep -A1 "^$1<<" "$OUT/output.txt" | tail -1; }
          echo "total=$(output total-tests) failed=$(output failed-tests)"
          test "$(output total-tests)" = 7
          test "$(output failed-tests)" = 2
          # The tests of both bundles are listed.
          grep -q "SampleAppTests / CalculatorXCTests" "$OUT/summary.md"
          grep -q "GreeterTests / GreeterTests" "$OUT/summary.md"
